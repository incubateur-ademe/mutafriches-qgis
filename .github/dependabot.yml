version: 2
updates:
  # L'extension n'a aucune dépendance d'exécution : seuls l'outillage et les actions bougent
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      outillage:
        patterns: ["*"]
